name: MCP Orchestrator Package CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        cd ../..
        npm ci
        cd packages/mcp-orchestrator
        npm ci
        
    - name: Run tests
      run: npm test
      
    - name: Build package
      run: npm run build